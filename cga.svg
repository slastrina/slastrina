<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" xml:space="preserve" role="img" aria-label="Samuel Lastrina — CGA themed homepage. BIOS boots, then a DOS terminal welcomes you.">
  <style>
    .mono { font-family: 'IBM Plex Mono', Menlo, Consolas, 'Courier New', ui-monospace, monospace; font-weight: 700; letter-spacing: 0.5px; }
    .cyan { fill: #55FFFF; }
    .magenta { fill: #FF55FF; }
    .white { fill: #FFFFFF; }
    .black { fill: #000000; }
    .cur { animation: blink 1.05s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }
  </style>

  <rect width="720" height="400" fill="#000000"/>

  <!-- ============ BIOS POST ============ -->
  <g id="boot" class="mono" font-size="14" opacity="1">
    <text class="white" x="20" y="32">American Megatrends BIOS  Build 4.7.1</text>
    <text class="white" x="20" y="50">(C) 1989-2026 Samuel Industries Inc.</text>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.05s" fill="freeze"/>
      <text class="cyan" x="20" y="86">CPU      : <tspan class="white">i80486DX2-66 MHz</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.05s" fill="freeze"/>
      <text class="cyan" x="20" y="104">MEMORY   : <tspan class="white">640K BASE, 7168K EXTENDED</tspan>  <tspan class="magenta">[OK]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.05s" fill="freeze"/>
      <text class="cyan" x="20" y="122">KEYBOARD : <tspan class="white">DETECTED</tspan>  <tspan class="magenta">[OK]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.10s" dur="0.05s" fill="freeze"/>
      <text class="cyan" x="20" y="140">MOUSE    : <tspan class="white">SERIAL COM1</tspan>  <tspan class="magenta">[OK]</tspan></text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.05s" fill="freeze"/>
      <text class="white" x="20" y="176">DETECTING IDE DEVICES...</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.75s" dur="0.05s" fill="freeze"/>
      <text class="white" x="20" y="194">  C: <tspan class="cyan">SAMUEL.SYS</tspan>      <tspan class="magenta">[OK]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.00s" dur="0.05s" fill="freeze"/>
      <text class="white" x="20" y="212">  D: <tspan class="cyan">3DMODELS.IMG</tspan>    <tspan class="magenta">[OK]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.25s" dur="0.05s" fill="freeze"/>
      <text class="white" x="20" y="230">  E: <tspan class="cyan">PROJECTS.DAT</tspan>    <tspan class="magenta">[OK]</tspan></text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.05s" fill="freeze"/>
      <text class="white" x="20" y="266">LOADING CGA.DRV ................. <tspan class="magenta">[OK]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.05s" fill="freeze"/>
      <text class="white" x="20" y="284">STARTING SAMUEL.SYS .............</text>
    </g>

    <animate attributeName="opacity" from="1" to="0" begin="3.60s" dur="0.40s" fill="freeze"/>
  </g>

  <!-- ============ WELCOME SCREEN ============ -->
  <g id="welcome" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.00s" dur="0.40s" fill="freeze"/>

    <rect x="8" y="8" width="704" height="384" fill="none" stroke="#55FFFF" stroke-width="2"/>
    <rect x="10" y="10" width="700" height="26" fill="#FF55FF"/>
    <text class="mono black" x="20" y="29" font-size="16">SAMUEL.SYS</text>
    <text class="mono black" x="700" y="29" font-size="16" text-anchor="end">C:\GITHUB\SLASTRINA</text>

    <g class="mono" font-size="16">
      <text class="cyan" x="24" y="74">C:\&gt; <tspan class="white">VER</tspan></text>
      <text class="white" x="24" y="96">CGA MODE 4   PALETTE 1   320x200   4 COLORS</text>

      <text class="cyan" x="24" y="138">C:\&gt; <tspan class="white">WHOAMI</tspan></text>
      <text class="white" x="24" y="160">SAM — A GEEKY/NERDY LOVER OF TECHNOLOGY.</text>
      <text class="white" x="24" y="182">EVERYTHING FROM SOFTWARE TO 3D MODELS LIVES HERE.</text>
      <text class="white" x="24" y="204">STAR WHAT YOU LIKE; COLLABORATION ALWAYS WELCOME.</text>

      <text class="cyan" x="24" y="246">C:\&gt; <tspan class="white">DIR /W</tspan></text>
      <text class="magenta" x="24" y="268">&lt;SOFTWARE&gt;     &lt;3DMODELS&gt;     &lt;PROJECTS&gt;</text>

      <text class="cyan" x="24" y="310">C:\&gt; <tspan class="white">LOAD HOMEPAGE.EXE</tspan></text>
      <text class="white" x="24" y="332">LOADING ........................... <tspan class="cyan">[ OK ]</tspan></text>

      <text class="cyan" x="24" y="374">C:\&gt; <tspan class="white cur">█</tspan></text>
    </g>
  </g>
</svg>
